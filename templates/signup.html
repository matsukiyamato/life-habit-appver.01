{% extends 'base.html' %}
{% block content %}
<main class="p-8 flex flex-col justify-center h-full">
    <div class="mb-10">
        <h1 class="text-3xl font-bold text-text-main">新規登録</h1>
        <p class="text-gray-400 text-sm">今日から新しい習慣を始めましょう</p>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <p class="text-red-500 text-xs font-bold mb-4 bg-red-50 p-3 rounded-xl border border-red-100">{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/signup" class="space-y-4">
        <input type="text" name="username" placeholder="ユーザー名" class="w-full p-4 bg-bg-light border-0 rounded-2xl focus:ring-2 focus:ring-primary" required>
        <input type="email" name="email" placeholder="メールアドレス" class="w-full p-4 bg-bg-light border-0 rounded-2xl focus:ring-2 focus:ring-primary" required>
        <input type="password" name="password" placeholder="パスワード" class="w-full p-4 bg-bg-light border-0 rounded-2xl focus:ring-2 focus:ring-primary" required>
        <input type="password" name="password_confirm" placeholder="パスワード確認" class="w-full p-4 bg-bg-light border-0 rounded-2xl focus:ring-2 focus:ring-primary" required>
        
        <button type="submit" class="w-full p-5 bg-primary text-text-main font-bold rounded-[2rem] shadow-xl shadow-primary/20 active:scale-95 transition-transform mt-4">
            アカウント作成
        </button>
    </form>
</main>
{% endblock %}
