{% extends 'base.html' %}
{% block content %}
<main class="p-6">
    <div class="flex justify-between items-center mb-8">
        <a href="/" class="material-symbols-outlined text-text-main">arrow_back</a>
        <h1 class="text-xl font-bold">習慣詳細</h1>
        <div></div>
    </div>

    <div class="text-center mb-10">
        <h2 class="text-3xl font-bold text-text-main mb-2">{{ habit.name }}</h2>
        <div class="inline-block px-4 py-2 bg-primary rounded-full text-xs font-bold">
            累計達成：{{ total }} 回
        </div>
    </div>

    <section class="mb-12">
        <h3 class="font-bold text-gray-400 text-xs uppercase tracking-widest mb-4">Past Records</h3>
        <div class="space-y-2">
            {% for log in logs %}
            <div class="flex justify-between items-center p-4 bg-bg-light rounded-2xl">
                <span class="font-bold text-text-main">{{ log.date }}</span>
                <span class="text-xs font-bold text-green-600 bg-green-50 px-3 py-1 rounded-full">達成</span>
            </div>
            {% else %}
            <p class="text-center text-gray-400 text-sm">記録がまだありません</p>
            {% endfor %}
        </div>
    </section>

    <div class="flex gap-4">
        <button class="flex-1 p-4 border-2 border-text-main text-text-main font-bold rounded-2xl">編集</button>
        
        <form action="{{ url_for('delete_habit', habit_id=habit.id) }}" method="POST" class="flex-1" onsubmit="return confirm('本当に削除しますか？');">
            <button type="submit" class="w-full p-4 bg-red-500 text-white font-bold rounded-2xl">削除</button>
        </form>
    </div>
</main>
{% endblock %}
