{% extends 'base.html' %}
{% block content %}
<main class="p-8 flex flex-col justify-center h-full">
    <div class="text-center mb-10">
        <div class="size-20 bg-primary rounded-[2rem] mx-auto flex items-center justify-center mb-4 shadow-xl shadow-primary/20">
            <span class="material-symbols-outlined text-4xl text-text-main font-bold">bolt</span>
        </div>
        <h1 class="text-3xl font-bold text-text-main">Life</h1>
        <p class="text-gray-400 text-sm">おかえりなさい</p>
    </div>

    <form method="POST" action="/login" class="space-y-4">
        <input type="email" name="email" placeholder="メールアドレス" class="w-full p-4 bg-bg-light border-0 rounded-2xl focus:ring-2 focus:ring-primary" required>
        <input type="password" name="password" placeholder="パスワード" class="w-full p-4 bg-bg-light border-0 rounded-2xl focus:ring-2 focus:ring-primary" required>
        <button type="submit" class="w-full p-5 bg-text-main text-white font-bold rounded-[2rem] shadow-xl active:scale-95 transition-transform">
            ログイン
        </button>
    </form>
    
    <p class="text-center mt-8 text-xs text-gray-400">
        アカウントをお持ちでないですか？ <a href="/signup" class="text-text-main font-bold">新規登録はこちら</a>
    </p>
</main>
{% endblock %}
